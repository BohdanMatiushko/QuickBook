openapi: 3.0.3
info:
  title: QuickBook API
  version: 1.0.0
  description: API для системи бронювання послуг QuickBook
paths:
  /api/appointments/:
    get:
      operationId: appointments_list
      description: Отримати список бронювань (клієнти бачать свої, адміни — усі)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - appointments
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAppointmentList'
          description: ''
    post:
      operationId: appointments_create
      description: Створити нове бронювання
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Appointment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Appointment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Appointment'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
  /api/appointments/{id}/:
    get:
      operationId: appointments_retrieve
      description: Отримати деталі бронювання
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - appointments
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    put:
      operationId: appointments_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Appointment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Appointment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Appointment'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    patch:
      operationId: appointments_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - appointments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAppointment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAppointment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAppointment'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: ''
    delete:
      operationId: appointments_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - appointments
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/categories/:
    get:
      operationId: categories_list
      description: Отримати список усіх категорій
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - categories
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryList'
          description: ''
    post:
      operationId: categories_create
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
  /api/categories/{id}/:
    get:
      operationId: categories_retrieve
      description: Отримати деталі категорії
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категорія.
        required: true
      tags:
      - categories
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    put:
      operationId: categories_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категорія.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Category'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Category'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Category'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    patch:
      operationId: categories_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категорія.
        required: true
      tags:
      - categories
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategory'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
          description: ''
    delete:
      operationId: categories_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Категорія.
        required: true
      tags:
      - categories
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/services/:
    get:
      operationId: services_list
      description: Отримати список усіх послуг
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - services
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedServiceList'
          description: ''
    post:
      operationId: services_create
      description: Створити нову послугу (лише для адміністраторів)
      tags:
      - services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Service'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Service'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Service'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: ''
  /api/services/{id}/:
    get:
      operationId: services_retrieve
      description: Отримати деталі послуги
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Послуга.
        required: true
      tags:
      - services
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: ''
    put:
      operationId: services_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Послуга.
        required: true
      tags:
      - services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Service'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Service'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Service'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: ''
    patch:
      operationId: services_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Послуга.
        required: true
      tags:
      - services
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedService'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedService'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedService'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
          description: ''
    delete:
      operationId: services_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Послуга.
        required: true
      tags:
      - services
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client:
          type: integer
          readOnly: true
          title: Клієнт
        client_name:
          type: string
          readOnly: true
        service:
          type: integer
          title: Послуга
        service_name:
          type: string
          title: Назва послуги
          readOnly: true
        specialist:
          type: integer
          nullable: true
          title: Фахівець
        specialist_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          title: Дата
        start_time:
          type: string
          format: time
          title: Час початку
        end_time:
          type: string
          format: time
          nullable: true
          title: Час завершення
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          title: Статус
        notes:
          type: string
          title: Примітки
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Створено
      required:
      - client
      - client_name
      - created_at
      - date
      - id
      - service
      - service_name
      - specialist_name
      - start_time
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Назва категорії
          maxLength: 100
        description:
          type: string
          title: Опис категорії
        icon:
          type: string
          nullable: true
          title: Іконка
          maxLength: 100
        is_active:
          type: boolean
          title: Активна
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Порядок сортування
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Створено
      required:
      - created_at
      - id
      - name
    PaginatedAppointmentList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Appointment'
    PaginatedCategoryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Category'
    PaginatedServiceList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Service'
    PatchedAppointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client:
          type: integer
          readOnly: true
          title: Клієнт
        client_name:
          type: string
          readOnly: true
        service:
          type: integer
          title: Послуга
        service_name:
          type: string
          title: Назва послуги
          readOnly: true
        specialist:
          type: integer
          nullable: true
          title: Фахівець
        specialist_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          title: Дата
        start_time:
          type: string
          format: time
          title: Час початку
        end_time:
          type: string
          format: time
          nullable: true
          title: Час завершення
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          title: Статус
        notes:
          type: string
          title: Примітки
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Створено
    PatchedCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Назва категорії
          maxLength: 100
        description:
          type: string
          title: Опис категорії
        icon:
          type: string
          nullable: true
          title: Іконка
          maxLength: 100
        is_active:
          type: boolean
          title: Активна
        sort_order:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          title: Порядок сортування
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Створено
    PatchedService:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Назва послуги
          maxLength: 255
        category:
          type: integer
          title: Категорія
        category_name:
          type: string
          title: Назва категорії
          readOnly: true
        description:
          type: string
          title: Опис
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Ціна
        duration:
          type: string
          title: Тривалість
        is_active:
          type: boolean
          title: Активна
        max_clients:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Макс. кількість клієнтів
        image_url:
          type: string
          format: uri
          nullable: true
          title: URL зображення
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Створено
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Оновлено
    Service:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          title: Назва послуги
          maxLength: 255
        category:
          type: integer
          title: Категорія
        category_name:
          type: string
          title: Назва категорії
          readOnly: true
        description:
          type: string
          title: Опис
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: Ціна
        duration:
          type: string
          title: Тривалість
        is_active:
          type: boolean
          title: Активна
        max_clients:
          type: integer
          maximum: 2147483647
          minimum: 0
          title: Макс. кількість клієнтів
        image_url:
          type: string
          format: uri
          nullable: true
          title: URL зображення
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: Створено
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: Оновлено
      required:
      - category
      - category_name
      - created_at
      - duration
      - id
      - name
      - price
      - updated_at
    StatusEnum:
      enum:
      - scheduled
      - completed
      - cancelled
      type: string
      description: |-
        * `scheduled` - Заплановано
        * `completed` - Виконано
        * `cancelled` - Скасовано
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
